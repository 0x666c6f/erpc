logLevel: error
tracing:
  enabled: true
  endpoint: "otel-collector.opentelemetry.svc.cluster.local:4317"
  protocol: "grpc"
  sampleRate: 0.01
  detailed: true
server:
  listenV4: true
  httpHostV4: "0.0.0.0"
  httpPortV4: 4000
  maxTimeout: "120s"
  executionHeaders: summary
healthCheck:
  mode: simple
  defaultEval: "any:initializedUpstreams"
metrics:
  enabled: true
  listenV4: true
  hostV4: "0.0.0.0"
  port: 4001
  errorLabelMode: compact
  histogramBuckets: "0.05,0.5,5,30"
  histogramDropLabels:
    - agent_name
    - composite
rateLimiters:
  store:
    driver: redis
    redis:
      uri: "redis://default:__SECRET_REDIS_PASSWORD__@erpc-redis-haproxy:6379"
  budgets:
    - id: lite-app
      rules:
        - method: "*"
          maxCount: 20
          period: 1s
    - id: quicknode-budget
      rules:
        - method: "*"
          maxCount: 500
          period: 1s
database:
  evmJsonRpcCache:
    envelope: true
    compression:
      enabled: true
      algorithm: zstd
      zstdLevel: fastest
      threshold: 1024
    connectors:
      - id: "postgres-connector"
        driver: "postgresql"
        postgresql: &postgres-config
          connectionUri: "postgres://postgres:__SECRET_POSTGRES_PASSWORD__@erpc-db-rw.morpho-prd.svc.cluster.local:5432/erpc"
          table: rpc_cache
          initTimeout: 5s
          getTimeout: 5s
          setTimeout: 5s
          minConns: 2
          maxConns: 15
          readonlyConnectionUris:
            - postgres://postgres:__SECRET_POSTGRES_PASSWORD__@erpc-db-r.morpho-prd.svc.cluster.local:5432/erpc
      - id: "redis-connector"
        driver: "redis"
        redis:
          uri: "redis://default:__SECRET_REDIS_PASSWORD__@erpc-redis-haproxy:6379"
          getTimeout: 3s
          setTimeout: 3s
    policies:
      # ===========================================
      # Method-specific policies with numeric blocks
      # These have longer TTLs because data at a specific block is immutable
      # ===========================================

      # Don't cache null/empty block responses in case nodes are late
      - network: "*"
        method: "eth_getBlockByNumber"
        finality: "finalized"
        empty: "ignore"
        connector: "postgres-connector"
        ttl: 0
      # eth_call with numeric blocks - unfinalized
      - network: "*"
        method: "eth_call"
        params: ["*", "0x*"]
        finality: "unfinalized"
        connector: "redis-connector"
        ttl: 60s
      # eth_getStorageAt with numeric blocks - unfinalized
      - network: "*"
        method: "eth_getStorageAt"
        params: ["*", "*", "0x*"]
        finality: "unfinalized"
        connector: "redis-connector"
        ttl: 60s
      # eth_getBalance with numeric blocks - unfinalized
      - network: "*"
        method: "eth_getBalance"
        params: ["*", "0x*"]
        finality: "unfinalized"
        connector: "redis-connector"
        ttl: 60s
      # eth_getBlockByNumber with numeric blocks - unfinalized
      - network: "*"
        method: "eth_getBlockByNumber"
        params: ["0x*", "*"]
        finality: "unfinalized"
        connector: "redis-connector"
        ttl: 60s
      # eth_getCode with numeric blocks - unfinalized
      - network: "*"
        method: "eth_getCode"
        params: ["*", "0x*"]
        finality: "unfinalized"
        connector: "redis-connector"
        ttl: 60s
      # eth_chainId - never changes
      - network: "*"
        method: "eth_chainId"
        finality: "unknown"
        connector: "postgres-connector"
        ttl: 0
      # ===========================================
      # Default policies by finality
      # ===========================================
      - network: "*"
        method: "*"
        finality: "finalized"
        empty: "allow"
        connector: "postgres-connector"
        ttl: 0
      - network: "*"
        method: "*"
        finality: "unfinalized"
        connector: "redis-connector"
        ttl: 30s
      - network: "*"
        method: "*"
        finality: "realtime"
        connector: "redis-connector"
        ttl:
          blockTimeMultiplier: 1
          fallback: 2s
      - network: "*"
        method: "*"
        finality: "unknown"
        connector: "redis-connector"
        ttl: 5s
  sharedState:
    clusterKey: "erpc-morpho-cluster"
    connector:
      driver: "redis"
      redis:
        uri: "redis://default:__SECRET_REDIS_PASSWORD__@erpc-redis-haproxy:6379"
projects:
  - id: cache
    scoreMetricsWindowSize: 4m
    cors: &shared-cors
      allowedOrigins:
        - "https://*.morpho.org"
        - "https://*.morpho.dev"
        - "https://*morpho-blue-offchain-v2-server.netlify.app"
        - "https://*-morpho-addmo.vercel.app"
      allowedMethods:
        - "GET"
        - "POST"
        - "OPTIONS"
      allowedHeaders:
        - "*"
      allowCredentials: true
      maxAge: 3600
    auth: &shared-auth
      strategies:
        - type: database
          database:
            connector:
              id: auth-postgresql
              driver: postgresql
              postgresql:
                connectionUri: postgres://postgres:__SECRET_POSTGRES_PASSWORD__@erpc-db-rw.morpho-prd.svc.cluster.local:5432/erpc
                table: erpc_auth
    networks:
      - architecture: evm
        evm:
          chainId: 143
          integrity:
            enforceHighestBlock: true
        failsafe:
          - matchMethod: "eth_call"
            matchFinality:
              - realtime
              - unfinalized
            timeout:
              duration: "15s"
            retry:
              maxAttempts: 2
              delay: "250ms"
              backoffMaxDelay: "1s"
              backoffFactor: 2
              emptyResultDelay: "100ms"
            hedge: ~
      - architecture: evm
        evm:
          chainId: 2741
        directiveDefaults:
          # Abstract returns zero tx roots for non-empty blocks.
          validateTransactionsRoot: false
    upstreamDefaults: &upstream-defaults
      evm:
        statePollerInterval: 10s
        statePollerDebounce: 5s
      failsafe:
        timeout:
          duration: "120s"
        retry:
          maxAttempts: 2
          delay: "500ms"
          backoffMaxDelay: "5s"
          backoffFactor: 3
        hedge:
          delay:
            base: "2s"
            quantile: 0.95
            min: "1s"
            max: "5s"
          maxCount: 1
        circuitBreaker:
          failureThresholdCount: 10
          failureThresholdCapacity: 20
          halfOpenAfter: "15s"
          successThresholdCount: 3
          successThresholdCapacity: 5
      routing:
        scoreMultipliers:
          - network: "*"
            method: "*"
            totalRequests: 0 # Disabled - pure performance mode
            respLatency: 8.0 # Highest weight - fastest wins
            errorRate: 4.0 # Penalize errors
            misbehaviors: 5.0 # Penalize consensus violations
            throttledRate: 3.0 # Penalize rate limits
            blockHeadLag: 2.0 # Penalize stale block head
            finalizationLag: 1.0 # Lowest weight
