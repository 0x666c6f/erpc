          value: "500"
        - name: TARGET_REQUEST_RATE
          value: "50"
        - name: TARGET_CPU
          value: "60"
        - name: WEIGHT_GOROUTINES
          value: "0.30"
        - name: WEIGHT_LATENCY
          value: "0.35"
        - name: WEIGHT_REQUEST_RATE
