apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "erpc.fullname" . }}-pdb
  labels:
    {{- include "erpc.labels" . | nindent 4 }}
spec:
  minAvailable: {{ sub .Values.autoscaling.minReplicas 1 }}
  selector:
    matchLabels:
      {{- include "erpc.selectorLabels" . | nindent 6 }}
