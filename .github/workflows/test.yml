name: test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, morpho-main]
  pull_request:
    branches: [main, morpho-main]

permissions:
  contents: read

jobs:
  typescript-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies without postinstall hooks
        run: pnpm install --ignore-scripts
        env:
          CI: true
      - name: Build config package
        run: pnpm --filter @erpc-cloud/config build
      - name: Test config package types
        run: pnpm --filter @erpc-cloud/config test

  units:
    runs-on: "${{ github.repository_owner == 'erpc' && 'blacksmith-8vcpu-ubuntu-2404' || 'ubuntu-24.04' }}"
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install dependencies
        run: make setup
      - name: Build
        run: make build
      - name: Test packages with the Go CLI
        run: make test-fast PKG_EXCLUDE_REGEX='^github\.com/erpc/erpc/(cmd|test|erpc)($$|/)'
      - name: Test erpc critical paths
        run: |
          go test ./erpc -run '^(TestConsensusPolicy|TestConsensusPolicy_DSLScenarios)$' -count=1 -parallel 1 -timeout 3m -v
          make test-fallback-config

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.x'
          cache: false
      - name: Check workflow security policy
        run: go test ./internal/ci -count=1 -v
      - name: Run Gosec Security Scanner
        run: |
          set +e
          docker run --rm \
            --workdir /github/workspace \
            -v "$PWD:/github/workspace" \
            ghcr.io/securego/gosec@sha256:d0859f242774504d57b17442b2dc77d4ffd2f4d30fbdf92c7eb612b2a394f477 \
            "-exclude=G115 -exclude-dir=test -tests=false ./..." 2>&1 | tee gosec.log
          status=${PIPESTATUS[0]}
          if grep -Eq 'Issues[[:space:]]*:[[:space:]]*[1-9][0-9]*' gosec.log; then
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            if grep -Eq 'Issues[[:space:]]*:[[:space:]]*0' gosec.log && grep -Eq 'Golang errors|Error building the SSA representation|Panic when running SSA analyzer' gosec.log; then
              echo "::warning::gosec exited with analyzer/type-loader errors but reported Issues : 0; the units job validates compilation."
              exit 0
            fi
            exit "$status"
          fi
