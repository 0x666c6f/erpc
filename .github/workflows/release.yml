name: release

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECR_VALIDATOR_REPOSITORY: ${{ vars.ECR_VALIDATOR_REPOSITORY }}

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag for the release (e.g., 1.0.0)'
        required: true
  push:
    branches:
      - morpho-main

permissions: {}

jobs:
  # Create Release PR - only on workflow_dispatch
  prepare-release:
    permissions:
      contents: write
      pull-requests: write
    runs-on: "${{ github.repository_owner == 'erpc' && 'blacksmith-8vcpu-ubuntu-2404' || 'ubuntu-24.04' }}"
    if: github.event_name == 'workflow_dispatch'
    outputs:
      version: ${{ steps.validate-version.outputs.version_tag }}
    steps:
      - name: Validate version tag
        id: validate-version
        env:
          VERSION_TAG: ${{ github.event.inputs.version_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version_tag: $VERSION_TAG" >&2
            exit 1
          fi
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"

      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.x'

      - name: Generate types
        run: |
          go install github.com/gzuidhof/tygo@v0.2.21
          tygo generate
      
      - name: Setup Syft
        uses: anchore/sbom-action/download-syft@28d71544de8eaf1b958d335707167c5f783590ad # v0.22.2

      # Run goreleaser in snapshot mode to generate checksums
      - name: Run GoReleaser Snapshot
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
        env:
          GORELEASER_CURRENT_TAG: ${{ steps.validate-version.outputs.version_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Setup pnpm + node and install dependencies
      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies without postinstall hooks
        run: pnpm install --ignore-scripts
        env:
          CI: true

      - name: Try building npm package
        run: pnpm run build

      # Update version in package.json files
      - name: Update package versions
        env:
          VERSION_TAG: ${{ steps.validate-version.outputs.version_tag }}
        run: |
          for pkg in . typescript/cli typescript/config; do
            cd $pkg
            npm version "$VERSION_TAG" --no-git-tag-version
            cd -
          done

      # Generate the release files using the snapshot checksums
      - name: Generate CLI release files
        working-directory: typescript/cli
        env:
          VERSION_TAG: ${{ steps.validate-version.outputs.version_tag }}
          COMMIT_SHA: ${{ github.sha }}
          CHECKSUMS_FILE: ../../dist/checksums.txt
        run: |
          export VERSION="$VERSION_TAG"
          pnpm run build
          npx ts-node ./src/script/generate-release-files.ts

      - name: Cleanup generated files 
        run: |
          rm -rf dist/

      # Create PR with all changes
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ steps.validate-version.outputs.version_tag }}
        run: |
          set -euo pipefail
          BRANCH="release/${VERSION_TAG}"
          TITLE="chore: release ${VERSION_TAG}"
          BODY_FILE="$(mktemp)"

          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -B "$BRANCH"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No release changes to commit"
            exit 0
          fi

          git add .
          git commit -m "$TITLE"
          git push --force-with-lease origin "$BRANCH"

          cat > "$BODY_FILE" <<EOF
          🚀 Release preparation for version ${VERSION_TAG}

          This PR includes:
          - Version bumps in package.json files
          - Generated TypeScript types
          - Generated release files
          - Generated checksums
          EOF

          if gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$BODY_FILE" --add-label release
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base morpho-main --head "$BRANCH" --title "$TITLE" --body-file "$BODY_FILE" --label release
          fi

  # Run on release PR merge
  release:
    permissions:
      contents: write
      attestations: write
      id-token: write
    if: |
      github.event_name == 'push' && 
      github.ref == 'refs/heads/morpho-main' && 
      contains(github.event.head_commit.message, 'chore: release')
    runs-on: "${{ github.repository_owner == 'erpc' && 'blacksmith-8vcpu-ubuntu-2404' || 'ubuntu-24.04' }}"
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Syft
        uses: anchore/sbom-action/download-syft@28d71544de8eaf1b958d335707167c5f783590ad # v0.22.2

      # Extract version from commit message
      - name: Extract version
        id: version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          VERSION=$(echo "$COMMIT_MESSAGE" | grep -oP 'release \K([0-9]+\.[0-9]+\.[0-9]+)')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.x'

      - name: Configure Git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      # Create git tag
      - name: Create tag
        run: |
          git tag ${{ steps.version.outputs.VERSION }} -f
          git push origin ${{ steps.version.outputs.VERSION }} -f

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-checksums: ./dist/checksums.txt

      # Setup pnpm + node and install dependencies
      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies without postinstall hooks
        run: pnpm install --ignore-scripts
        env:
          CI: true

      # Publish packages
      - name: Build and publish CLI package
        working-directory: typescript/cli
        run: |
          pnpm run build
          pnpm publish --access public --no-git-checks || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publish the same package under the "start-rpc" name
      - name: Publish start-rpc alias package
        working-directory: typescript/cli
        run: |
          # Backup the original package.json
          cp package.json package.json.bak
          # Modify the package.json name from "@erpc-cloud/cli" to "start-rpc"
          sed -i 's/"@erpc-cloud\/cli"/"start-rpc"/' package.json
          # Publish under the new name
          pnpm publish --access public --no-git-checks || true
          # Restore the original package.json
          mv package.json.bak package.json
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publish the same package under the "start-erpc" name
      - name: Publish start-erpc alias package
        working-directory: typescript/cli
        run: |
          # Backup the original package.json
          cp package.json package.json.bak
          # Modify the package.json name from "@erpc-cloud/cli" to "start-erpc"
          sed -i 's/"@erpc-cloud\/cli"/"start-erpc"/' package.json
          # Publish under the new name
          pnpm publish --access public --no-git-checks || true
          # Restore the original package.json
          mv package.json.bak package.json
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build and publish Config package
        working-directory: typescript/config
        run: |
          pnpm run build
          pnpm publish --access public --no-git-checks || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Native single-arch builds on matching runners; then compose a multi-arch manifest
  docker-build-amd64:
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    runs-on: "${{ github.repository_owner == 'erpc' && 'blacksmith-8vcpu-ubuntu-2404' || 'ubuntu-24.04' }}"
    if: github.event_name == 'push' && github.ref == 'refs/heads/morpho-main'
    timeout-minutes: 35
    outputs:
      digest_main: ${{ steps.build_main.outputs.digest }}
      digest_release: ${{ steps.build_release.outputs.digest }}
      digest_main_validator: ${{ steps.build_main_validator.outputs.digest }}
      digest_release_validator: ${{ steps.build_release_validator.outputs.digest }}
      digest_main_ecr: ${{ steps.build_main_ecr.outputs.digest }}
      digest_release_ecr: ${{ steps.build_release_ecr.outputs.digest }}
      digest_main_validator_ecr: ${{ steps.build_main_validator_ecr.outputs.digest }}
      digest_release_validator_ecr: ${{ steps.build_release_validator_ecr.outputs.digest }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@376925c9d111252e87ae59691e5a442dd100ef6a # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Compute repo and short SHA
        id: meta
        run: |
          REPO="${{ github.repository }}"
          echo "repo=${REPO@L}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Extract version (release commits only)
        id: version
        if: "contains(github.event.head_commit.message, 'chore: release')"
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          VERSION=$(echo "$COMMIT_MESSAGE" | grep -oP 'release \K([0-9]+\.[0-9]+\.[0-9]+)')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build+push by digest (branch)
        id: build_main
        if: github.event.inputs.version_tag == ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT_SHA=${{ steps.meta.outputs.short_sha }}
          sbom: false # not supported on docker driver, maybe works with blacksmith?
          outputs: type=registry,name=ghcr.io/${{ steps.meta.outputs.repo }},push-by-digest=true

      - name: Build+push to ECR by digest (branch)
        id: build_main_ecr
        if: github.event.inputs.version_tag == ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT_SHA=${{ steps.meta.outputs.short_sha }}
          sbom: false # not supported on docker driver, maybe works with blacksmith?
          outputs: type=registry,name=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }},push-by-digest=true

      - name: Build+push by digest (release)
        id: build_release
        if: "contains(github.event.head_commit.message, 'chore: release')"
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT_SHA=${{ steps.meta.outputs.short_sha }}
          sbom: false # not supported on docker driver, maybe works with blacksmith?
          outputs: type=registry,name=ghcr.io/${{ steps.meta.outputs.repo }},push-by-digest=true

      - name: Build+push to ECR by digest (release)
        id: build_release_ecr
        if: "contains(github.event.head_commit.message, 'chore: release')"
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT_SHA=${{ steps.meta.outputs.short_sha }}
          sbom: false # not supported on docker driver, maybe works with blacksmith?
          outputs: type=registry,name=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }},push-by-digest=true

      - name: Build+push validator by digest (branch)
        id: build_main_validator
        if: github.event.inputs.version_tag == ''
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.validator
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT_SHA=${{ steps.meta.outputs.short_sha }}
          sbom: false # not supported on docker driver, maybe works with blacksmith?
          outputs: type=registry,name=ghcr.io/${{ steps.meta.outputs.repo }}-validator,push-by-digest=true

      - name: Build+push validator to ECR by digest (branch)
        id: build_main_validator_ecr
        if: github.event.inputs.version_tag == ''
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.validator
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT_SHA=${{ steps.meta.outputs.short_sha }}
          sbom: false # not supported on docker driver, maybe works with blacksmith?
          outputs: type=registry,name=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_VALIDATOR_REPOSITORY }},push-by-digest=true

      - name: Build+push validator by digest (release)
        id: build_release_validator
        if: "contains(github.event.head_commit.message, 'chore: release')"
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.validator
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT_SHA=${{ steps.meta.outputs.short_sha }}
          sbom: false # not supported on docker driver, maybe works with blacksmith?
          outputs: type=registry,name=ghcr.io/${{ steps.meta.outputs.repo }}-validator,push-by-digest=true

      - name: Build+push validator to ECR by digest (release)
        id: build_release_validator_ecr
        if: "contains(github.event.head_commit.message, 'chore: release')"
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.validator
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT_SHA=${{ steps.meta.outputs.short_sha }}
          sbom: false # not supported on docker driver, maybe works with blacksmith?
          outputs: type=registry,name=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_VALIDATOR_REPOSITORY }},push-by-digest=true

      - name: Attest build provenance (Docker Build)
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        if: steps.build_release.outputs.digest != '' || steps.build_main.outputs.digest != ''
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.repo }}
          subject-digest: "${{ contains(github.event.head_commit.message, 'chore: release') && steps.build_release.outputs.digest || steps.build_main.outputs.digest }}"
          push-to-registry: true

      - name: Attest build provenance (Docker Build Validator)
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        if: steps.build_release_validator.outputs.digest != '' || steps.build_main_validator.outputs.digest != ''
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.repo }}-validator
          subject-digest: "${{ contains(github.event.head_commit.message, 'chore: release') && steps.build_release_validator.outputs.digest || steps.build_main_validator.outputs.digest }}"
          push-to-registry: true

  docker-build-arm64:
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    runs-on: "${{ github.repository_owner == 'erpc' && 'blacksmith-8vcpu-ubuntu-2404-arm' || 'ubuntu-24.04-arm' }}"
    if: github.event_name == 'push' && github.ref == 'refs/heads/morpho-main'
    timeout-minutes: 35
    outputs:
      digest_main: ${{ steps.build_main.outputs.digest }}
      digest_release: ${{ steps.build_release.outputs.digest }}
      digest_main_validator: ${{ steps.build_main_validator.outputs.digest }}
      digest_release_validator: ${{ steps.build_release_validator.outputs.digest }}
      digest_main_ecr: ${{ steps.build_main_ecr.outputs.digest }}
      digest_release_ecr: ${{ steps.build_release_ecr.outputs.digest }}
      digest_main_validator_ecr: ${{ steps.build_main_validator_ecr.outputs.digest }}
      digest_release_validator_ecr: ${{ steps.build_release_validator_ecr.outputs.digest }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@376925c9d111252e87ae59691e5a442dd100ef6a # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Compute repo and short SHA
        id: meta
        run: |
          REPO="${{ github.repository }}"
          echo "repo=${REPO@L}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Extract version (release commits only)
        id: version
        if: "contains(github.event.head_commit.message, 'chore: release')"
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          VERSION=$(echo "$COMMIT_MESSAGE" | grep -oP 'release \K([0-9]+\.[0-9]+\.[0-9]+)')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build+push by digest (branch)
        id: build_main
        if: github.event.inputs.version_tag == ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT_SHA=${{ steps.meta.outputs.short_sha }}
          sbom: false # not supported on docker driver, maybe works with blacksmith?
          outputs: type=registry,name=ghcr.io/${{ steps.meta.outputs.repo }},push-by-digest=true

      - name: Build+push to ECR by digest (branch)
        id: build_main_ecr
        if: github.event.inputs.version_tag == ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT_SHA=${{ steps.meta.outputs.short_sha }}
          sbom: false # not supported on docker driver, maybe works with blacksmith?
          outputs: type=registry,name=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }},push-by-digest=true

      - name: Build+push by digest (release)
        id: build_release
        if: "contains(github.event.head_commit.message, 'chore: release')"
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT_SHA=${{ steps.meta.outputs.short_sha }}
          sbom: false # not supported on docker driver, maybe works with blacksmith?
          outputs: type=registry,name=ghcr.io/${{ steps.meta.outputs.repo }},push-by-digest=true

      - name: Build+push to ECR by digest (release)
        id: build_release_ecr
        if: "contains(github.event.head_commit.message, 'chore: release')"
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT_SHA=${{ steps.meta.outputs.short_sha }}
          sbom: false # not supported on docker driver, maybe works with blacksmith?
          outputs: type=registry,name=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }},push-by-digest=true

      - name: Build+push validator by digest (branch)
        id: build_main_validator
        if: github.event.inputs.version_tag == ''
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.validator
          platforms: linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT_SHA=${{ steps.meta.outputs.short_sha }}
          sbom: false # not supported on docker driver, maybe works with blacksmith?
          outputs: type=registry,name=ghcr.io/${{ steps.meta.outputs.repo }}-validator,push-by-digest=true

      - name: Build+push validator to ECR by digest (branch)
        id: build_main_validator_ecr
        if: github.event.inputs.version_tag == ''
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.validator
          platforms: linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT_SHA=${{ steps.meta.outputs.short_sha }}
          sbom: false # not supported on docker driver, maybe works with blacksmith?
          outputs: type=registry,name=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_VALIDATOR_REPOSITORY }},push-by-digest=true

      - name: Build+push validator by digest (release)
        id: build_release_validator
        if: "contains(github.event.head_commit.message, 'chore: release')"
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.validator
          platforms: linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT_SHA=${{ steps.meta.outputs.short_sha }}
          sbom: false # not supported on docker driver, maybe works with blacksmith?
          outputs: type=registry,name=ghcr.io/${{ steps.meta.outputs.repo }}-validator,push-by-digest=true

      - name: Build+push validator to ECR by digest (release)
        id: build_release_validator_ecr
        if: "contains(github.event.head_commit.message, 'chore: release')"
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.validator
          platforms: linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT_SHA=${{ steps.meta.outputs.short_sha }}
          sbom: false # not supported on docker driver, maybe works with blacksmith?
          outputs: type=registry,name=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_VALIDATOR_REPOSITORY }},push-by-digest=true
      
      - name: Attest build provenance (Docker Build)
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        if: steps.build_release.outputs.digest != '' || steps.build_main.outputs.digest != ''
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.repo }}
          subject-digest: "${{ contains(github.event.head_commit.message, 'chore: release') && steps.build_release.outputs.digest || steps.build_main.outputs.digest }}"
          push-to-registry: true

      - name: Attest build provenance (Docker Build Validator)
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        if: steps.build_release_validator.outputs.digest != '' || steps.build_main_validator.outputs.digest != ''
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.repo }}-validator
          subject-digest: "${{ contains(github.event.head_commit.message, 'chore: release') && steps.build_release_validator.outputs.digest || steps.build_main_validator.outputs.digest }}"
          push-to-registry: true

  docker-manifest:
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    runs-on: "${{ github.repository_owner == 'erpc' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}"
    needs: [docker-build-amd64, docker-build-arm64]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/morpho-main'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@376925c9d111252e87ae59691e5a442dd100ef6a # v2

      - name: Compute repo
        id: meta
        run: |
          REPO="${{ github.repository }}"
          echo "repo=${REPO@L}" >> "$GITHUB_OUTPUT"

      - name: Extract version (release commits only)
        id: version
        if: "contains(github.event.head_commit.message, 'chore: release')"
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          VERSION=$(echo "$COMMIT_MESSAGE" | grep -oP 'release \K([0-9]+\.[0-9]+\.[0-9]+)')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create multi-arch manifest for branch
        id: main
        if: github.event.inputs.version_tag == ''
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ steps.meta.outputs.repo }}:${{ github.ref_name }} \
            ghcr.io/${{ steps.meta.outputs.repo }}@${{ needs.docker-build-amd64.outputs.digest_main }} \
            ghcr.io/${{ steps.meta.outputs.repo }}@${{ needs.docker-build-arm64.outputs.digest_main }}

          docker buildx imagetools create \
            -t ghcr.io/${{ steps.meta.outputs.repo }}-validator:${{ github.ref_name }} \
            ghcr.io/${{ steps.meta.outputs.repo }}-validator@${{ needs.docker-build-amd64.outputs.digest_main_validator }} \
            ghcr.io/${{ steps.meta.outputs.repo }}-validator@${{ needs.docker-build-arm64.outputs.digest_main_validator }}

          docker pull ghcr.io/${{ steps.meta.outputs.repo }}:${{ github.ref_name }}
          DIGEST_MAIN=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/${{ steps.meta.outputs.repo }}:${{ github.ref_name }})
          docker pull ghcr.io/${{ steps.meta.outputs.repo }}-validator:${{ github.ref_name }}
          DIGEST_MAIN_VALIDATOR=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/${{ steps.meta.outputs.repo }}-validator:${{ github.ref_name }})
          echo "digest_main=${DIGEST_MAIN#*@}" >> "$GITHUB_OUTPUT"
          echo "digest_main_validator=${DIGEST_MAIN_VALIDATOR#*@}" >> "$GITHUB_OUTPUT"

      - name: Create ECR multi-arch manifest for branch
        if: github.event.inputs.version_tag == ''
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker buildx imagetools create \
            -t "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" \
            "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}@${{ needs.docker-build-amd64.outputs.digest_main_ecr }}" \
            "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}@${{ needs.docker-build-arm64.outputs.digest_main_ecr }}"

          docker buildx imagetools create \
            -t "$ECR_REGISTRY/${{ env.ECR_VALIDATOR_REPOSITORY }}:${{ github.sha }}" \
            "$ECR_REGISTRY/${{ env.ECR_VALIDATOR_REPOSITORY }}@${{ needs.docker-build-amd64.outputs.digest_main_validator_ecr }}" \
            "$ECR_REGISTRY/${{ env.ECR_VALIDATOR_REPOSITORY }}@${{ needs.docker-build-arm64.outputs.digest_main_validator_ecr }}"

      - name: Create multi-arch manifests for release
        id: release
        if: "contains(github.event.head_commit.message, 'chore: release')"
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ steps.meta.outputs.repo }}:${{ steps.version.outputs.VERSION }} \
            ghcr.io/${{ steps.meta.outputs.repo }}@${{ needs.docker-build-amd64.outputs.digest_release }} \
            ghcr.io/${{ steps.meta.outputs.repo }}@${{ needs.docker-build-arm64.outputs.digest_release }}
          
          docker buildx imagetools create \
            -t ghcr.io/${{ steps.meta.outputs.repo }}:latest \
            ghcr.io/${{ steps.meta.outputs.repo }}@${{ needs.docker-build-amd64.outputs.digest_release }} \
            ghcr.io/${{ steps.meta.outputs.repo }}@${{ needs.docker-build-arm64.outputs.digest_release }}

          docker buildx imagetools create \
            -t ghcr.io/${{ steps.meta.outputs.repo }}-validator:${{ steps.version.outputs.VERSION }} \
            ghcr.io/${{ steps.meta.outputs.repo }}-validator@${{ needs.docker-build-amd64.outputs.digest_release_validator }} \
            ghcr.io/${{ steps.meta.outputs.repo }}-validator@${{ needs.docker-build-arm64.outputs.digest_release_validator }}

          docker buildx imagetools create \
            -t ghcr.io/${{ steps.meta.outputs.repo }}-validator:latest \
            ghcr.io/${{ steps.meta.outputs.repo }}-validator@${{ needs.docker-build-amd64.outputs.digest_release_validator }} \
            ghcr.io/${{ steps.meta.outputs.repo }}-validator@${{ needs.docker-build-arm64.outputs.digest_release_validator }}
          
          docker pull ghcr.io/${{ steps.meta.outputs.repo }}:${{ steps.version.outputs.VERSION }}
          DIGEST_RELEASE=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/${{ steps.meta.outputs.repo }}:${{ steps.version.outputs.VERSION }})
          docker pull ghcr.io/${{ steps.meta.outputs.repo }}:latest
          DIGEST_LATEST=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/${{ steps.meta.outputs.repo }}:latest)
          docker pull ghcr.io/${{ steps.meta.outputs.repo }}-validator:${{ steps.version.outputs.VERSION }}
          DIGEST_RELEASE_VALIDATOR=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/${{ steps.meta.outputs.repo }}-validator:${{ steps.version.outputs.VERSION }})
          docker pull ghcr.io/${{ steps.meta.outputs.repo }}-validator:latest
          DIGEST_LATEST_VALIDATOR=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/${{ steps.meta.outputs.repo }}-validator:latest)
          echo "digest_release=${DIGEST_RELEASE#*@}" >> "$GITHUB_OUTPUT"
          echo "digest_latest=${DIGEST_LATEST#*@}" >> "$GITHUB_OUTPUT"
          echo "digest_release_validator=${DIGEST_RELEASE_VALIDATOR#*@}" >> "$GITHUB_OUTPUT"
          echo "digest_latest_validator=${DIGEST_LATEST_VALIDATOR#*@}" >> "$GITHUB_OUTPUT"

      - name: Create ECR multi-arch manifests for release
        if: "contains(github.event.head_commit.message, 'chore: release')"
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker buildx imagetools create \
            -t "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ steps.version.outputs.VERSION }}" \
            "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}@${{ needs.docker-build-amd64.outputs.digest_release_ecr }}" \
            "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}@${{ needs.docker-build-arm64.outputs.digest_release_ecr }}"

          docker buildx imagetools create \
            -t "$ECR_REGISTRY/${{ env.ECR_VALIDATOR_REPOSITORY }}:${{ steps.version.outputs.VERSION }}" \
            "$ECR_REGISTRY/${{ env.ECR_VALIDATOR_REPOSITORY }}@${{ needs.docker-build-amd64.outputs.digest_release_validator_ecr }}" \
            "$ECR_REGISTRY/${{ env.ECR_VALIDATOR_REPOSITORY }}@${{ needs.docker-build-arm64.outputs.digest_release_validator_ecr }}"

      - name: Attest build provenance (Docker Manifest Main)
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        if: github.event.inputs.version_tag == ''
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.repo }}
          subject-digest: "${{ steps.main.outputs.digest_main }}"
          push-to-registry: true

      - name: Attest build provenance (Docker Manifest Main Validator)
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        if: github.event.inputs.version_tag == ''
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.repo }}-validator
          subject-digest: "${{ steps.main.outputs.digest_main_validator }}"
          push-to-registry: true

      - name: Attest build provenance (Docker Manifest Release)
        if: "contains(github.event.head_commit.message, 'chore: release')"
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.repo }}
          subject-digest: "${{ steps.release.outputs.digest_release }}"
          push-to-registry: true

      - name: Attest build provenance (Docker Manifest Latest)
        if: "contains(github.event.head_commit.message, 'chore: release')"
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.repo }}
          subject-digest: "${{ steps.release.outputs.digest_latest }}"
          push-to-registry: true

      - name: Attest build provenance (Docker Manifest Release Validator)
        if: "contains(github.event.head_commit.message, 'chore: release')"
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.repo }}-validator
          subject-digest: "${{ steps.release.outputs.digest_release_validator }}"
          push-to-registry: true

      - name: Attest build provenance (Docker Manifest Latest Validator)
        if: "contains(github.event.head_commit.message, 'chore: release')"
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.repo }}-validator
          subject-digest: "${{ steps.release.outputs.digest_latest_validator }}"
          push-to-registry: true

  # Cleanup sha256-* tags that are created when pushing by digest.
  # We keep only meaningful tags like "main", "latest" and semver releases.
  docker-cleanup-sha256-tags:
    permissions:
      packages: write
    runs-on: "${{ github.repository_owner == 'erpc' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}"
    needs: [docker-manifest]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/morpho-main'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - name: Delete sha256-* GHCR tags (keep main/latest/semver)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          OWNER="${REPO%%/*}"
          NAME="${REPO#*/}"
          PACKAGE="${NAME,,}" # lower-case
          PACKAGE_VALIDATOR="${PACKAGE}-validator"

          if [[ "${{ github.repository_owner }}" == "erpc" ]]; then
            SCOPE_PATH="orgs/$OWNER"
          else
            SCOPE_PATH="users/$OWNER"
          fi

          for PKG in "$PACKAGE" "$PACKAGE_VALIDATOR"; do
            echo "Scanning GHCR package '$PKG' under $SCOPE_PATH for sha256-only versions to delete..."
            gh api --paginate "/$SCOPE_PATH/packages/container/$PKG/versions?per_page=100" \
              -H "Accept: application/vnd.github+json" \
            | jq -r '
                .[]
                | select(.metadata.container.tags | length == 1)
                | select((.metadata.container.tags | map(startswith("sha256-")) | all))
                | .id
              ' \
            | while read -r VERSION_ID; do
                echo "Deleting $PKG version ${VERSION_ID} (sha256-only tags)..."
                gh api --method DELETE "/$SCOPE_PATH/packages/container/$PKG/versions/${VERSION_ID}" \
                  -H "Accept: application/vnd.github+json" || true
              done
          done
