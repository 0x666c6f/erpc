name: release

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECR_VALIDATOR_REPOSITORY: ${{ vars.ECR_VALIDATOR_REPOSITORY }}

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag for the release (e.g., 1.0.0)'
        required: true
  push:
    tags:
      - "*.*.*"

permissions: {}

jobs:
  # Create Release PR - only on workflow_dispatch
  prepare-release:
    permissions:
      contents: write
      pull-requests: write
    runs-on: "${{ github.repository_owner == 'erpc' && 'blacksmith-8vcpu-ubuntu-2404' || 'ubuntu-24.04' }}"
    if: github.event_name == 'workflow_dispatch'
    outputs:
      version: ${{ steps.validate-version.outputs.version }}
    steps:
      - name: Validate version_tag
        id: validate-version
        shell: bash
        env:
          VERSION_TAG: ${{ github.event.inputs.version_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid version_tag: %s\n' "$VERSION_TAG" >&2
            exit 1
          fi

          printf 'version=%s\n' "$VERSION_TAG" >> "$GITHUB_OUTPUT"

      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.x'
          cache: false

      - name: Generate types
        run: |
          go install github.com/gzuidhof/tygo@v0.2.21
          tygo generate
      
      - name: Setup Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # Run goreleaser in snapshot mode to generate checksums
      - name: Run GoReleaser Snapshot
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
        env:
          GORELEASER_CURRENT_TAG: ${{ steps.validate-version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Setup pnpm + node and install dependencies
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies without postinstall hooks
        run: pnpm install --ignore-scripts
        env:
          CI: true

      - name: Try building npm package
        run: pnpm run build

      # Update version in package.json files
      - name: Update package versions
        env:
          VERSION_TAG: ${{ steps.validate-version.outputs.version }}
        run: |
          for pkg in . typescript/cli typescript/config; do
            cd "$pkg"
            npm version "$VERSION_TAG" --no-git-tag-version
            cd -
          done

      # Generate the release files using the snapshot checksums
      - name: Generate CLI release files
        working-directory: typescript/cli
        env:
          CHECKSUMS_FILE: ../../dist/checksums.txt
          COMMIT_SHA: ${{ github.sha }}
          VERSION_TAG: ${{ steps.validate-version.outputs.version }}
        run: |
          export VERSION="$VERSION_TAG"
          export COMMIT_SHA
          export CHECKSUMS_FILE
          pnpm run build
          npx ts-node ./src/script/generate-release-files.ts

      - name: Cleanup generated files 
        run: |
          rm -rf dist/

      # Create PR with all changes
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ steps.validate-version.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="release/${VERSION_TAG}"
          TITLE="chore: release ${VERSION_TAG}"
          BODY_FILE="$(mktemp)"

          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -B "$BRANCH"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No release changes to commit"
            exit 0
          fi

          git add .
          git commit -m "$TITLE"
          git push --force-with-lease origin "$BRANCH"

          cat > "$BODY_FILE" <<EOF
          🚀 Release preparation for version ${VERSION_TAG}

          This PR includes:
          - Version bumps in package.json files
          - Generated TypeScript types
          - Generated release files
          - Generated checksums
          EOF

          if gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$BODY_FILE" --add-label release
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base morpho-main --head "$BRANCH" --title "$TITLE" --body-file "$BODY_FILE" --label release
          fi

  # Run only on protected release tag pushes.
  release:
    permissions:
      contents: write
      attestations: write
      id-token: write
    if: |
      github.event_name == 'push' && 
      github.ref_type == 'tag'
    environment: release
    runs-on: "${{ github.repository_owner == 'erpc' && 'blacksmith-8vcpu-ubuntu-2404' || 'ubuntu-24.04' }}"
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # Extract version from the protected release tag.
      - name: Validate release tag
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid release tag: %s\n' "$VERSION" >&2
            exit 1
          fi
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.x'
          cache: false

      - name: Configure Git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-checksums: ./dist/checksums.txt

      # Setup pnpm + node and install dependencies
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies without postinstall hooks
        run: pnpm install --ignore-scripts
        env:
          CI: true

      # Publish packages. publish-npm.sh tolerates already-published versions
      # (idempotent re-runs) but fails the job on any other error, e.g. an
      # expired NPM_TOKEN (npm reports rejected auth as E404 on the PUT).
      - name: Build and publish CLI package
        working-directory: typescript/cli
        run: |
          pnpm run build
          ../../.github/scripts/publish-npm.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publish the same package under the "erpc" name
      - name: Publish erpc alias package
        working-directory: typescript/cli
        run: ../../.github/scripts/publish-npm.sh erpc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publish the same package under the "start-rpc" name
      - name: Publish start-rpc alias package
        working-directory: typescript/cli
        run: ../../.github/scripts/publish-npm.sh start-rpc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publish the same package under the "start-erpc" name
      - name: Publish start-erpc alias package
        working-directory: typescript/cli
        run: ../../.github/scripts/publish-npm.sh start-erpc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build and publish Config package
        working-directory: typescript/config
        run: |
          pnpm run build
          ../../.github/scripts/publish-npm.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Hard guarantee that every package name actually serves this version,
      # so a swallowed or half-failed publish can never go unnoticed again.
      # NODE_AUTH_TOKEN is needed because setup-node's .npmrc references it
      # for every npm invocation, not just publishes.
      - name: Verify packages are live on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          for pkg in @erpc-cloud/cli erpc start-rpc start-erpc @erpc-cloud/config; do
            for attempt in 1 2 3 4 5; do
              if [ -n "$(npm view "${pkg}@${VERSION}" version 2>/dev/null)" ]; then
                echo "OK: ${pkg}@${VERSION} is live"
                continue 2
              fi
              echo "Waiting for ${pkg}@${VERSION} (attempt ${attempt}/5)..."
              sleep 10
            done
            echo "::error::${pkg}@${VERSION} is not on the registry after publishing"
            exit 1
          done

  # Native single-arch builds on matching runners; then compose a multi-arch manifest
  docker-build-amd64:
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    runs-on: "${{ github.repository_owner == 'erpc' && 'blacksmith-8vcpu-ubuntu-2404' || 'ubuntu-24.04' }}"
    if: github.event_name == 'push' && github.ref_type == 'tag'
    environment: release
    timeout-minutes: 35
    outputs:
      digest_release: ${{ steps.build_release.outputs.digest }}
      digest_release_validator: ${{ steps.build_release_validator.outputs.digest }}
      digest_release_ecr: ${{ steps.build_release_ecr.outputs.digest }}
      digest_release_validator_ecr: ${{ steps.build_release_validator_ecr.outputs.digest }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@376925c9d111252e87ae59691e5a442dd100ef6a # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Compute repo and short SHA
        id: meta
        run: |
          REPO="${{ github.repository }}"
          echo "repo=${REPO@L}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid release tag: %s\n' "$VERSION" >&2
            exit 1
          fi
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build+push by digest (release)
        id: build_release
        if: "github.ref_type == 'tag'"
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT_SHA=${{ steps.meta.outputs.short_sha }}
          sbom: false # not supported on docker driver, maybe works with blacksmith?
          outputs: type=registry,name=ghcr.io/${{ steps.meta.outputs.repo }},push-by-digest=true

      - name: Build+push to ECR by digest (release)
        id: build_release_ecr
        if: "github.ref_type == 'tag'"
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT_SHA=${{ steps.meta.outputs.short_sha }}
          sbom: false # not supported on docker driver, maybe works with blacksmith?
          outputs: type=registry,name=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }},push-by-digest=true

      - name: Build+push validator by digest (release)
        id: build_release_validator
        if: "github.ref_type == 'tag'"
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.validator
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT_SHA=${{ steps.meta.outputs.short_sha }}
          sbom: false # not supported on docker driver, maybe works with blacksmith?
          outputs: type=registry,name=ghcr.io/${{ steps.meta.outputs.repo }}-validator,push-by-digest=true

      - name: Build+push validator to ECR by digest (release)
        id: build_release_validator_ecr
        if: "github.ref_type == 'tag'"
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.validator
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT_SHA=${{ steps.meta.outputs.short_sha }}
          sbom: false # not supported on docker driver, maybe works with blacksmith?
          outputs: type=registry,name=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_VALIDATOR_REPOSITORY }},push-by-digest=true

      - name: Attest build provenance (Docker Build)
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        if: steps.build_release.outputs.digest != ''
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.repo }}
          subject-digest: "${{ steps.build_release.outputs.digest }}"
          push-to-registry: true

      - name: Attest build provenance (Docker Build Validator)
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        if: steps.build_release_validator.outputs.digest != ''
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.repo }}-validator
          subject-digest: "${{ steps.build_release_validator.outputs.digest }}"
          push-to-registry: true

  docker-build-arm64:
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    runs-on: "${{ github.repository_owner == 'erpc' && 'blacksmith-8vcpu-ubuntu-2404-arm' || 'ubuntu-24.04-arm' }}"
    if: github.event_name == 'push' && github.ref_type == 'tag'
    environment: release
    timeout-minutes: 35
    outputs:
      digest_release: ${{ steps.build_release.outputs.digest }}
      digest_release_validator: ${{ steps.build_release_validator.outputs.digest }}
      digest_release_ecr: ${{ steps.build_release_ecr.outputs.digest }}
      digest_release_validator_ecr: ${{ steps.build_release_validator_ecr.outputs.digest }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@376925c9d111252e87ae59691e5a442dd100ef6a # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Compute repo and short SHA
        id: meta
        run: |
          REPO="${{ github.repository }}"
          echo "repo=${REPO@L}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid release tag: %s\n' "$VERSION" >&2
            exit 1
          fi
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build+push by digest (release)
        id: build_release
        if: "github.ref_type == 'tag'"
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT_SHA=${{ steps.meta.outputs.short_sha }}
          sbom: false # not supported on docker driver, maybe works with blacksmith?
          outputs: type=registry,name=ghcr.io/${{ steps.meta.outputs.repo }},push-by-digest=true

      - name: Build+push to ECR by digest (release)
        id: build_release_ecr
        if: "github.ref_type == 'tag'"
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT_SHA=${{ steps.meta.outputs.short_sha }}
          sbom: false # not supported on docker driver, maybe works with blacksmith?
          outputs: type=registry,name=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }},push-by-digest=true

      - name: Build+push validator by digest (release)
        id: build_release_validator
        if: "github.ref_type == 'tag'"
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.validator
          platforms: linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT_SHA=${{ steps.meta.outputs.short_sha }}
          sbom: false # not supported on docker driver, maybe works with blacksmith?
          outputs: type=registry,name=ghcr.io/${{ steps.meta.outputs.repo }}-validator,push-by-digest=true

      - name: Build+push validator to ECR by digest (release)
        id: build_release_validator_ecr
        if: "github.ref_type == 'tag'"
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.validator
          platforms: linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT_SHA=${{ steps.meta.outputs.short_sha }}
          sbom: false # not supported on docker driver, maybe works with blacksmith?
          outputs: type=registry,name=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_VALIDATOR_REPOSITORY }},push-by-digest=true
      
      - name: Attest build provenance (Docker Build)
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        if: steps.build_release.outputs.digest != ''
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.repo }}
          subject-digest: "${{ steps.build_release.outputs.digest }}"
          push-to-registry: true

      - name: Attest build provenance (Docker Build Validator)
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        if: steps.build_release_validator.outputs.digest != ''
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.repo }}-validator
          subject-digest: "${{ steps.build_release_validator.outputs.digest }}"
          push-to-registry: true

  docker-manifest:
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    runs-on: "${{ github.repository_owner == 'erpc' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}"
    needs: [docker-build-amd64, docker-build-arm64]
    if: always() && github.event_name == 'push' && github.ref_type == 'tag'
    environment: release
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@376925c9d111252e87ae59691e5a442dd100ef6a # v2

      - name: Compute repo
        id: meta
        run: |
          REPO="${{ github.repository }}"
          echo "repo=${REPO@L}" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid release tag: %s\n' "$VERSION" >&2
            exit 1
          fi
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifests for release
        id: release
        if: "github.ref_type == 'tag'"
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ steps.meta.outputs.repo }}:${{ steps.version.outputs.VERSION }} \
            ghcr.io/${{ steps.meta.outputs.repo }}@${{ needs.docker-build-amd64.outputs.digest_release }} \
            ghcr.io/${{ steps.meta.outputs.repo }}@${{ needs.docker-build-arm64.outputs.digest_release }}
          
          docker buildx imagetools create \
            -t ghcr.io/${{ steps.meta.outputs.repo }}:latest \
            ghcr.io/${{ steps.meta.outputs.repo }}@${{ needs.docker-build-amd64.outputs.digest_release }} \
            ghcr.io/${{ steps.meta.outputs.repo }}@${{ needs.docker-build-arm64.outputs.digest_release }}

          docker buildx imagetools create \
            -t ghcr.io/${{ steps.meta.outputs.repo }}-validator:${{ steps.version.outputs.VERSION }} \
            ghcr.io/${{ steps.meta.outputs.repo }}-validator@${{ needs.docker-build-amd64.outputs.digest_release_validator }} \
            ghcr.io/${{ steps.meta.outputs.repo }}-validator@${{ needs.docker-build-arm64.outputs.digest_release_validator }}

          docker buildx imagetools create \
            -t ghcr.io/${{ steps.meta.outputs.repo }}-validator:latest \
            ghcr.io/${{ steps.meta.outputs.repo }}-validator@${{ needs.docker-build-amd64.outputs.digest_release_validator }} \
            ghcr.io/${{ steps.meta.outputs.repo }}-validator@${{ needs.docker-build-arm64.outputs.digest_release_validator }}
          
          docker pull ghcr.io/${{ steps.meta.outputs.repo }}:${{ steps.version.outputs.VERSION }}
          DIGEST_RELEASE=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/${{ steps.meta.outputs.repo }}:${{ steps.version.outputs.VERSION }})
          docker pull ghcr.io/${{ steps.meta.outputs.repo }}:latest
          DIGEST_LATEST=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/${{ steps.meta.outputs.repo }}:latest)
          docker pull ghcr.io/${{ steps.meta.outputs.repo }}-validator:${{ steps.version.outputs.VERSION }}
          DIGEST_RELEASE_VALIDATOR=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/${{ steps.meta.outputs.repo }}-validator:${{ steps.version.outputs.VERSION }})
          docker pull ghcr.io/${{ steps.meta.outputs.repo }}-validator:latest
          DIGEST_LATEST_VALIDATOR=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/${{ steps.meta.outputs.repo }}-validator:latest)
          {
            echo "digest_release=${DIGEST_RELEASE#*@}"
            echo "digest_latest=${DIGEST_LATEST#*@}"
            echo "digest_release_validator=${DIGEST_RELEASE_VALIDATOR#*@}"
            echo "digest_latest_validator=${DIGEST_LATEST_VALIDATOR#*@}"
          } >> "$GITHUB_OUTPUT"

      - name: Create ECR multi-arch manifests for release
        if: "github.ref_type == 'tag'"
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker buildx imagetools create \
            -t "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ steps.version.outputs.VERSION }}" \
            "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}@${{ needs.docker-build-amd64.outputs.digest_release_ecr }}" \
            "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}@${{ needs.docker-build-arm64.outputs.digest_release_ecr }}"

          docker buildx imagetools create \
            -t "$ECR_REGISTRY/${{ env.ECR_VALIDATOR_REPOSITORY }}:${{ steps.version.outputs.VERSION }}" \
            "$ECR_REGISTRY/${{ env.ECR_VALIDATOR_REPOSITORY }}@${{ needs.docker-build-amd64.outputs.digest_release_validator_ecr }}" \
            "$ECR_REGISTRY/${{ env.ECR_VALIDATOR_REPOSITORY }}@${{ needs.docker-build-arm64.outputs.digest_release_validator_ecr }}"

      - name: Attest build provenance (Docker Manifest Release)
        if: "github.ref_type == 'tag'"
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.repo }}
          subject-digest: "${{ steps.release.outputs.digest_release }}"
          push-to-registry: true

      - name: Attest build provenance (Docker Manifest Latest)
        if: "github.ref_type == 'tag'"
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.repo }}
          subject-digest: "${{ steps.release.outputs.digest_latest }}"
          push-to-registry: true

      - name: Attest build provenance (Docker Manifest Release Validator)
        if: "github.ref_type == 'tag'"
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.repo }}-validator
          subject-digest: "${{ steps.release.outputs.digest_release_validator }}"
          push-to-registry: true

      - name: Attest build provenance (Docker Manifest Latest Validator)
        if: "github.ref_type == 'tag'"
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.repo }}-validator
          subject-digest: "${{ steps.release.outputs.digest_latest_validator }}"
          push-to-registry: true

  # Cleanup sha256-* tags that are created when pushing by digest.
  # We keep only meaningful tags like "latest" and semver releases.
  docker-cleanup-sha256-tags:
    permissions:
      packages: write
    runs-on: "${{ github.repository_owner == 'erpc' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}"
    needs: [docker-manifest]
    if: always() && github.event_name == 'push' && github.ref_type == 'tag'
    environment: release
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Delete sha256-* GHCR tags (keep main/latest/semver)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          OWNER="${REPO%%/*}"
          NAME="${REPO#*/}"
          PACKAGE="${NAME,,}" # lower-case
          PACKAGE_VALIDATOR="${PACKAGE}-validator"

          if [[ "${{ github.repository_owner }}" == "erpc" ]]; then
            SCOPE_PATH="orgs/$OWNER"
          else
            SCOPE_PATH="users/$OWNER"
          fi

          for PKG in "$PACKAGE" "$PACKAGE_VALIDATOR"; do
            echo "Scanning GHCR package '$PKG' under $SCOPE_PATH for sha256-only versions to delete..."
            gh api --paginate "/$SCOPE_PATH/packages/container/$PKG/versions?per_page=100" \
              -H "Accept: application/vnd.github+json" \
            | jq -r '
                .[]
                | select(.metadata.container.tags | length == 1)
                | select((.metadata.container.tags | map(startswith("sha256-")) | all))
                | .id
              ' \
            | while read -r VERSION_ID; do
                echo "Deleting $PKG version ${VERSION_ID} (sha256-only tags)..."
                gh api --method DELETE "/$SCOPE_PATH/packages/container/$PKG/versions/${VERSION_ID}" \
                  -H "Accept: application/vnd.github+json" || true
              done
          done
